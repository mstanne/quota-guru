# TEMPORARY: test of the club-id correction on the real data, without saving or publishing anything.
# Runs on pushes to the correzione-squadre branch only; delete this file before merging.
name: Prova correzione squadre

on:
  push:
    branches: [correzione-squadre]

permissions:
  contents: read

concurrency:
  group: prova-correzione-squadre
  cancel-in-progress: true

jobs:
  prova:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Restore state (read only)
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/seo
            .cache/og
            .cache/match-details
          key: state-${{ github.run_id }}
          restore-keys: |
            state-
            seo-

      - name: Restore from the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/data-branch.sh restore-data
          scripts/data-branch.sh restore-state

      - name: Correction, map
        run: node scripts/migrations/correggi-squadre-2026-11.mjs prima

      - name: Download football data
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-football.mjs

      - name: Correction, data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/migrations/correggi-squadre-2026-11.mjs dati

      - name: Archive (derived files)
        run: node scripts/archive-data.mjs

      - name: Restore the predictions archive (read only)
        run: git clone --quiet --depth 1 --branch archivio-pronostici "https://github.com/${GITHUB_REPOSITORY}.git" .cache/predictions-archive

      - name: Correction, predictions
        run: node scripts/migrations/correggi-squadre-2026-11.mjs pronostici

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /
          SITE_URL: https://www.quotaguru.it

      - name: Checks
        run: node scripts/migrations/verifica-squadre-2026-11.mjs

      - name: Summary of the correction
        if: always()
        run: |
          {
            echo "### Mappa"; node -e 'const m=require("./data/id-map.json"); console.log("```\n"+JSON.stringify(m.correzioni,null,1).slice(0,6000)+"\n```")'
            echo "### Squadre nuove o abbinate in questo giro"; node -e 'const s=require("./public/stato-dati.json"); console.log("```\n"+JSON.stringify(s.calendarioCalcio?.squadreNuove??[],null,1).slice(0,4000)+"\n```")'
          } >> "$GITHUB_STEP_SUMMARY"
