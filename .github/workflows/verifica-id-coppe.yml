# Temporary check of API-Football ids (branch verifica-id-coppe only): prints league names, never the key.
name: Verifica id coppe
on:
  push:
    branches: [verifica-id-coppe]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verifica-id-coppe.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
