# One-off (manual): copies the old `dati` branch of this public repository, with its whole history, into the
# private repository mstanne/quota-guru-dati (docs/dati-privati.md). Run it once, after creating the private
# repository and the secret DATI_TOKEN and before deleting the old branch. Optional: without it the first save of
# deploy.yml starts the private branch from the current data, without the history.
# It never overwrites `dati`: if deploy.yml already created it, the history goes to the branch copia-cronologia. Sent in blocks of 20 commits (GitHub accepts
# at most 2 GB per push; the old branch is 2.7 GB).
name: Sposta dati nel repository privato

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-26.04
    steps:
      - name: Copy the branch with its history
        env:
          DATI_TOKEN: ${{ secrets.DATI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DATI_TOKEN" ]; then
            echo "::error::Segreto DATI_TOKEN mancante (docs/dati-privati.md)"
            exit 1
          fi
          priv="https://x-access-token:${DATI_TOKEN}@github.com/mstanne/quota-guru-dati.git"
          old="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git ls-remote --exit-code --heads "$priv" dati >/dev/null
          state=$?
          set -e
          if [ "$state" -eq 0 ]; then
            echo "Il branch dati privato esiste già (creato da deploy.yml): la cronologia va nel branch copia-cronologia"
          elif [ "$state" -ne 2 ]; then
            echo "::error::Repository mstanne/quota-guru-dati non raggiungibile: esiste ed è privato? Il token ha 'Contents: Read and write' su di esso?"
            exit 1
          fi
          if ! git ls-remote --exit-code --heads "$old" dati >/dev/null; then
            echo "Il vecchio branch dati non esiste più: il primo salvataggio di deploy.yml creerà quello privato" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone --quiet --bare --single-branch --branch dati "$old" dati.git
          n=$(git -C dati.git rev-list --count dati)
          echo "Copio $n commit ($(du -sh dati.git | cut -f1)) a blocchi di 20: GitHub accetta al massimo 2 GB per invio"
          # Oldest to newest into a temporary branch (each push sends only what is not there yet; a rerun after a
          # failure resumes almost for free). `dati` appears only at the end, complete: deploy.yml never reads a
          # half-copied history.
          i=0
          for c in $(git -C dati.git rev-list --reverse dati); do
            i=$((i + 1))
            if [ $((i % 20)) -eq 0 ] || [ "$i" -eq "$n" ]; then
              echo "Invio fino al commit $i di $n"
              if ! git -C dati.git push --quiet --force "$priv" "$c:refs/heads/copia-cronologia"; then
                echo "::error::Invio non riuscito al commit $i di $n: rilancia il workflow, riparte quasi da dove si è fermato"
                exit 1
              fi
            fi
          done
          # only if deploy.yml has not created `dati` (no --force)
          if [ "$state" -eq 2 ] && git -C dati.git push --quiet "$priv" "dati:refs/heads/dati"; then
            git -C dati.git push --quiet "$priv" --delete copia-cronologia || true
            echo "Copiati $n commit nel repository privato quota-guru-dati. Ora si può cancellare il branch dati di questo repository." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Copiati $n commit nel branch copia-cronologia del repository privato (il branch dati l'ha creato deploy.yml). Ora si può cancellare il branch dati di questo repository." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
