# Builds the site and publishes it to GitHub Pages on every push to main and every 3 hours
# (to refresh fixtures, results and standings from API-Sports).
# In between, live-scores.yml updates scores and standings every 15 minutes while matches are on.
# One-time setup:
#   - repo Settings -> Pages -> Source: "GitHub Actions"
#   - repo Settings -> Secrets and variables -> Actions -> New repository secret:
#       API_FOOTBALL_KEY    = <API-Sports key> (football and NBA: calendar, results, standings, squads, details)
#       BALLDONTLIE_API_KEY = <balldontlie.io API key> (optional: tennis and Lega Basket Serie A standings)
#       ANTHROPIC_API_KEY   = <Claude API key> (optional: rewrites the match texts; without it the template texts are used)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC), at minute 17 to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  # write: the build commits the archive of published predictions to the `archivio-pronostici` branch
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Restore state between runs
        # Kept between builds (scripts/prerender.mjs, scripts/fetch-football.mjs):
        #   .cache/seo            date of the last real change of every page (sitemap <lastmod>) and the archive of
        #                         finished match pages, published even after the matches leave the data window;
        #   .cache/og             16:9 social images of the match pages already drawn (scripts/lib/og-cards.mjs)
        #   .cache/match-details  goals and cards already downloaded for finished matches (when the plan has them)
        #                         the YouTube highlights already found and the API-Sports details (line-ups, stats…).
        # A new entry is saved at every run; restore-keys picks the most recent one.
        uses: actions/cache@v6
        with:
          path: |
            .cache/seo
            .cache/og
            .cache/match-details
          key: state-${{ github.run_id }}
          restore-keys: |
            state-
            seo-

      - name: Restore from the data branch
        # The site has no database: the `dati` branch keeps a permanent copy of the data and of the state in the
        # cache (scripts/data-branch.sh). The last saved data replace the old snapshot committed in main; the state
        # comes back only if GitHub deleted the cache.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/data-branch.sh restore-data
          scripts/data-branch.sh restore-state

      - name: Download football data
        # API-Football (API-Sports, Pro plan): every competition on the site, including Serie B and the European cups.
        # If the API is unreachable the last saved data are published (see the data branch step above).
        run: node scripts/fetch-football.mjs
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Download basket data
        # NBA from API-NBA (same API-Sports key); Lega Basket Serie A standings from BALLDONTLIE only if its key is set.
        run: node scripts/fetch-basket-data.mjs
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

      - name: Download tennis data
        # ATP/WTA rankings and tournament calendar (free plan); without the secret the committed snapshot is used.
        run: node scripts/fetch-tennis-data.mjs
        continue-on-error: true
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

      - name: Match details from API-Sports
        # Line-ups, events, statistics and ratings (football), box scores (NBA) of finished matches;
        # without the API_FOOTBALL_KEY secret the committed files are used. Results: /stato-dati.json on the site.
        run: node scripts/fetch-match-details.mjs
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Find official highlights on YouTube
        # Official league / broadcaster channels; optional free YOUTUBE_API_KEY secret reads 50 uploads instead of 15.
        run: node scripts/fetch-highlights.mjs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Past seasons for the archive, a small block per run
        # scripts/backfill-archive.mjs: at most 150 API-Sports requests per run, progress kept in the archive.
        # Competitions of the site plus Coppa Italia (archive only), back to ARCHIVE_SEASONS seasons.
        run: node scripts/backfill-archive.mjs
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # seasons before the current one to recover (default 10); repository variable, optional
          ARCHIVE_SEASONS: ${{ vars.ARCHIVE_SEASONS }}

      - name: Transfers, trophies and injuries of the players, a block per run
        # scripts/fetch-player-extras.mjs: at most 250 API-Sports requests per run (players who played most first),
        # plus who is out or doubtful for the next match. Writes data/giocatori-extra.json (player pages).
        run: node scripts/fetch-player-extras.mjs
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Update the permanent archive and the site's copy of the club logos
        # scripts/archive-data.mjs: data/archivio only grows; it is saved in the `dati` branch.
        run: node scripts/archive-data.mjs
        continue-on-error: true

      - name: Restore editorial cache
        # Claude rewrites already accepted: unchanged texts are not rewritten (or paid for) again
        uses: actions/cache@v6
        with:
          path: .cache/editorial-ai.json
          key: editorial-${{ github.run_id }}
          restore-keys: editorial-

      - name: Restore the Claude rewrites from the data branch if the cache was lost
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/data-branch.sh restore-editorial

      - name: Editorial texts for match pages
        # Template texts always; Claude rewrite only if the ANTHROPIC_API_KEY secret is set.
        # On any error the site is published with the template texts.
        run: node scripts/generate-editorial.mjs
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          EDITORIAL_AI: ${{ vars.EDITORIAL_AI }}
          EDITORIAL_AI_MODEL: ${{ vars.EDITORIAL_AI_MODEL }}
          EDITORIAL_AI_EFFORT: ${{ vars.EDITORIAL_AI_EFFORT }}
          EDITORIAL_AI_MAX: ${{ vars.EDITORIAL_AI_MAX }}

      - name: Log of the data added by the APIs
        # Compares the fresh data with the previous run (state in .cache/seo) and publishes /registro-dati.json,
        # read by the daily e-mail report. Never blocks the deploy.
        run: node scripts/log-data-changes.mjs
        continue-on-error: true

      - name: Keep the downloaded data for the quick live-score runs
        # live-scores.yml starts from these files and only updates scores and standings in between the full runs.
        # Stored inside .cache/match-details so the cache paths (and the existing cache) stay the same.
        run: |
          mkdir -p .cache/match-details
          tar czf .cache/match-details/snapshot.tgz --ignore-failed-read --exclude=data/archivio \
            src/data/football.json src/data/basket.json src/data/tennis.json \
            src/data/football-details.json src/data/basket-details.json src/data/highlights.json \
            src/data/editorial-ai.json data public/stato-dati.json public/loghi
        continue-on-error: true

      - name: Restore the predictions archive
        # Every published prediction is kept in the `archivio-pronostici` branch (scripts/archive-predictions.mjs):
        # its commit history is the public, timestamped record of when each prediction was published.
        # Pushing to that branch does not trigger this workflow (it runs on pushes to main only).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir=.cache/predictions-archive
          set +e
          git ls-remote --exit-code --heads "$url" archivio-pronostici >/dev/null
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git clone --quiet --depth 1 --branch archivio-pronostici "$url" "$dir"
          elif [ "$found" -eq 2 ]; then
            # first run: the branch is created by the save step below
            mkdir -p "$dir"
            git -C "$dir" init --quiet -b archivio-pronostici
            git -C "$dir" remote add origin "$url"
          else
            echo "::warning::Archivio pronostici non raggiungibile: questa build non lo aggiorna"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          # Node's default heap (about 4 GB) is no longer enough for vite to write the bundles (the site's data is
          # imported as JSON): the build stopped with "JavaScript heap out of memory". The runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=7168
          # project pages are served from https://<user>.github.io/<repo>/
          BASE_PATH: /
          # used for canonical URLs, sitemap.xml and robots.txt
          SITE_URL: https://www.quotaguru.it
          # optional analytics (Settings -> Secrets and variables -> Actions -> Variables); empty = disabled
          VITE_ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER }}
          VITE_ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
          VITE_COOKIE_POLICY_URL: ${{ vars.COOKIE_POLICY_URL }}
          # live data service (workers/live): when set, match pages update by themselves and replace SofaScore
          VITE_LIVE_URL: ${{ vars.LIVE_URL }}
          # share of expected goals in the prediction model (0 = off); turn on only after a backtest
          MODEL_XG_WEIGHT: ${{ vars.MODEL_XG_WEIGHT }}

      - name: Save the predictions archive
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: .cache/predictions-archive
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Archivio pronostici invariato"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Archivio pronostici $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin HEAD:archivio-pronostici

      - name: Save to the data branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/data-branch.sh save

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Keep the list of new or changed pages for IndexNow
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-urls
          path: .cache/seo/indexnow-urls.txt
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # After the pages are live: tells Bing and the other IndexNow engines which pages are new or changed
    # (scripts/indexnow.mjs). Never affects the published site.
    needs: deploy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/indexnow.mjs
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: indexnow-urls
          path: .cache/seo
        continue-on-error: true

      - name: Send changed pages to IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
        env:
          SITE_URL: https://www.quotaguru.it
