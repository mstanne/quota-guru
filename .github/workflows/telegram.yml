# Posts of the QuotaGuru Telegram channel (scripts/telegram/README.md).
# Every 20 minutes during the day scripts/telegram/publish.mjs sends the rubrics whose slot (Rome time) has come and that
# were not sent yet: the register in the `telegram-registro` branch stops a rubric going out twice, and the schedule
# needs no change between summer and winter time.
# The live worker (workers/live) starts it on time at those minutes and, as soon as new official line-ups come out,
# with rubrica=formazioni (secret GH_DISPATCH_TOKEN of the worker); GitHub's own schedule stays as a fallback.
# Also by hand: Actions → "Canale Telegram" → Run workflow (one rubric, now, or a dry run that only prints the posts).
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   secret   TELEGRAM_BOT_TOKEN      token from @BotFather (the bot is admin of both channels)
#   secret   TELEGRAM_TEST_CHAT_ID   numeric id of the private test channel (e.g. -1001234567890)
#   secret   TELEGRAM_CHAT_ID        public channel, e.g. @quotaguru
#   variable LIVE_URL                address of the live worker (already set for the site): official line-ups
#   variable TELEGRAM_MODE           "live" to post on the public channel; unset or anything else = test channel
name: Canale Telegram

on:
  schedule:
    - cron: "7-59/20 6-22 * * *" # 07:00–00:00 in Rome (UTC hours 6–22); same minutes as the live worker's timer
  workflow_dispatch:
    inputs:
      rubrica:
        description: "Rubrica da inviare subito (vuoto = quelle in programma ora)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - partite-oggi
          - track-record
          - academy
          - coppe
          - numeri
          - nba
          - anteprima-serie-a
          - anteprima-premier-league
          - anteprima-liga
          - anteprima-ligue-1
          - tris-weekend
          - dove-vederla
          - risultati
          - risultati-domenica
          - classifica
          - formazioni
      prova:
        description: "Prova a secco: stampa i post nel log senza inviarli"
        required: false
        type: boolean
        default: true

permissions:
  # write: the register of sent posts lives in the `telegram-registro` branch
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/telegram
            scripts/assets/fonts
            src/assets/brand/quotaguru-logo-dark-bg.svg
            src/assets/guides
            src/lib/goalStats.mjs
            src/lib/broadcast.ts
            src/data/offers.json
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # images of the posts (scripts/telegram/cards.mjs): only the renderer, same version as package-lock.json
      - name: Install the image renderer
        run: npm install --no-save --no-audit --no-fund @resvg/resvg-js@2.6.2

      - name: Send the rubrics due now
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_MODE: ${{ vars.TELEGRAM_MODE }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          GH_TOKEN: ${{ github.token }}
          RUBRICA: ${{ inputs.rubrica }}
          PROVA: ${{ inputs.prova }}
        run: |
          args=()
          if [ -n "$RUBRICA" ]; then args+=(--rubrica "$RUBRICA" --force); fi
          if [ "$PROVA" = "true" ]; then args+=(--dry-run); fi
          node scripts/telegram/publish.mjs "${args[@]}"
