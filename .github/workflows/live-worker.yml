# Publishes the live data service (workers/live, a Cloudflare Worker) when its code changes, or by hand
# (Actions → "Live worker" → Run workflow).
# One-time setup (see workers/live/README.md):
#   - repo Settings → Secrets and variables → Actions → New repository secret:
#       CLOUDFLARE_API_TOKEN  = Cloudflare API token, template "Edit Cloudflare Workers"
#       CLOUDFLARE_ACCOUNT_ID = Cloudflare account id (dashboard → Workers & Pages, right column)
#   - after the first run, the address printed in the run summary goes in the repository variable LIVE_URL
#     (Variables tab): from the next site update, match pages use it and SofaScore is no longer shown.
# The API-Football key (secret API_FOOTBALL_KEY, already used by the site) is copied to the worker as a secret.
#   - GH_DISPATCH_TOKEN (recommended): lets the worker start deploy.yml and live-scores.yml on time, see workers/live/README.md
name: Live worker

on:
  push:
    branches: [main]
    paths:
      - "workers/live/**"
      - "scripts/lib/match-details.mjs"
      - "scripts/lib/leagues.mjs"
      - ".github/workflows/live-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Check the Cloudflare secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::Secret CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID mancante: il worker non viene pubblicato (vedi workers/live/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install wrangler
        if: steps.check.outputs.ready == 'true'
        working-directory: workers/live
        run: npm ci

      # relay server with a dedicated IP (workers/live/server/README.md): used when both are set
      - name: Relay server
        id: relay
        if: steps.check.outputs.ready == 'true'
        env:
          API_BASE: ${{ vars.LIVE_API_BASE }}
          PROXY_SECRET: ${{ secrets.LIVE_PROXY_SECRET }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          list="API_FOOTBALL_KEY"
          if [ -n "$API_BASE" ] && [ -n "$PROXY_SECRET" ]; then
            list="$list API_BASE PROXY_SECRET"
            echo "Richieste ad API-Football tramite $API_BASE"
          fi
          # the worker starts deploy.yml and live-scores.yml on time (GitHub's own schedule is unreliable)
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            list="$list GH_DISPATCH_TOKEN"
          else
            echo "::warning::Secret GH_DISPATCH_TOKEN mancante: gli aggiornamenti restano affidati al cron di GitHub, che spesso salta"
          fi
          { echo 'list<<EOF'; printf '%s\n' $list; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Publish the worker
        id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/live
          command: deploy
          secrets: ${{ steps.relay.outputs.list }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASE: ${{ vars.LIVE_API_BASE }}
          PROXY_SECRET: ${{ secrets.LIVE_PROXY_SECRET }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}

      - name: Address of the worker
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Servizio dati live pubblicato"
            echo
            echo "Indirizzo: \`${URL:-vedi il log del passo precedente}\`"
            echo
            echo "Mettilo nella variabile del repository **LIVE_URL** (Settings → Secrets and variables → Actions → Variables)."
            echo "Stato: \`${URL}/stato\`"
          } >> "$GITHUB_STEP_SUMMARY"
