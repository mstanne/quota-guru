<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Surebet: quote di due operatori le cui probabilità implicite sommano meno del cento per cento</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F1A2C"/><stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FB6801" stop-opacity=".22"/><stop offset="1" stop-color="#FB6801" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#06BA55" stop-opacity=".18"/><stop offset="1" stop-color="#06BA55" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#EEF0F3" fill-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="170" r="520" fill="url(#glowO)"/>
<circle cx="260" cy="780" r="520" fill="url(#glowG)"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
<rect x="150" y="200" width="420" height="300" rx="24" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><rect x="650" y="200" width="420" height="300" rx="24" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><text x="360" y="270" font-size="30" fill="#BECED8" text-anchor="middle" font-weight="600" fill-opacity="1">Operatore 1 · A</text><text x="360" y="380" font-size="80" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">2,10</text><text x="360" y="450" font-size="32" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">47,6%</text><text x="860" y="270" font-size="30" fill="#BECED8" text-anchor="middle" font-weight="600" fill-opacity="1">Operatore 2 · B</text><text x="860" y="380" font-size="80" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">2,05</text><text x="860" y="450" font-size="32" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">48,8%</text><text x="610" y="370" font-size="60" fill="#7F93AE" text-anchor="middle" font-weight="700" fill-opacity="1">+</text><rect x="1130" y="300" width="330" height="110" rx="55.0" fill="#06BA55"/><text x="1295.0" y="374.44" font-size="54" fill="#0A1220" text-anchor="middle" font-weight="700" fill-opacity="1">96,4%</text><text x="1295" y="470" font-size="28" fill="#BECED8" text-anchor="middle" font-weight="600" fill-opacity="1">sotto il 100%</text><rect x="150" y="580" width="1310" height="56" rx="14" fill="#16243B"/><rect x="150" y="580" width="1263" height="56" rx="14" fill="#06BA55" fill-opacity=".8"/><line x1="1460" y1="560" x2="1460" y2="656" stroke="#FB6801" stroke-width="6"/><text x="150" y="700" font-size="28" fill="#7F93AE" text-anchor="start" font-weight="600" fill-opacity="1">quote che cambiano, giocate rifiutate, regole diverse</text>
</g>
</svg>
