<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Corsa ippica all'arrivo con tre cavalli numerati, quota fissa e totalizzatore</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F1A2C"/><stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FB6801" stop-opacity=".22"/><stop offset="1" stop-color="#FB6801" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#06BA55" stop-opacity=".18"/><stop offset="1" stop-color="#06BA55" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#EEF0F3" fill-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="170" r="520" fill="url(#glowO)"/>
<circle cx="260" cy="780" r="520" fill="url(#glowG)"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
<rect x="140" y="170" width="820" height="560" rx="28" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><line x1="190" y1="360" x2="910" y2="360" stroke="#2A3D59" stroke-width="3" stroke-dasharray="14 12"/><line x1="190" y1="480" x2="910" y2="480" stroke="#2A3D59" stroke-width="3" stroke-dasharray="14 12"/><line x1="190" y1="600" x2="910" y2="600" stroke="#2A3D59" stroke-width="3" stroke-dasharray="14 12"/><rect x="820" y="230" width="14" height="440" fill="#EEF0F3"/><rect x="700" y="290" width="120" height="80" rx="40.0" fill="#FB6801"/><text x="760.0" y="346.56" font-size="46" fill="#0A1220" text-anchor="middle" font-weight="700" fill-opacity="1">3</text><rect x="620" y="410" width="120" height="80" rx="40.0" fill="#06BA55"/><text x="680.0" y="466.56" font-size="46" fill="#0A1220" text-anchor="middle" font-weight="700" fill-opacity="1">7</text><rect x="520" y="530" width="120" height="80" rx="40.0" fill="#FBBF24"/><text x="580.0" y="586.56" font-size="46" fill="#0A1220" text-anchor="middle" font-weight="700" fill-opacity="1">1</text><text x="190" y="250" font-size="36" fill="#EEF0F3" text-anchor="start" font-weight="700" fill-opacity="1">Arrivo</text><rect x="1020" y="230" width="440" height="110" rx="55.0" fill="#2A3D59"/><text x="1240.0" y="298.68" font-size="38" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">Quota fissa</text><text x="1240" y="390" font-size="26" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">quota nota alla giocata</text><rect x="1020" y="450" width="440" height="110" rx="55.0" fill="#FB6801"/><text x="1240.0" y="518.68" font-size="38" fill="#0A1220" text-anchor="middle" font-weight="700" fill-opacity="1">Totalizzatore</text><text x="1240" y="610" font-size="26" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">quota calcolata dopo l'arrivo</text>
</g>
</svg>
