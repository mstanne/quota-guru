,648.4 A210,210 0 0 1 961.0,419.1" fill="none" stroke="#BECED8" stroke-width="64" stroke-linecap="butt" stroke-opacity="1.0"/><path d="M962.4,408.2 A210,210 0 0 1 1164.5,230.1" fill="none" stroke="#7F93AE" stroke-width="64" stroke-linecap="butt" stroke-opacity="1.0"/><path d="M1090.3,184.1 A268,268 0 0 1 1170.0,172.0" fill="none" stroke="#FB6801" stroke-width="22" stroke-linecap="round" stroke-opacity="1.0"/><text x="1170" y="446" font-size="66" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">104,8%</text><text x="1170" y="496" font-size="26" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">somma delle probabilità</text><rect x="910" y="160" width="220" height="56" rx="28.0" fill="#FB6801"/><text x="1020.0" y="198.08" font-size="28" fill="#0A1220" text-anchor="middle" font-weight="700" fill-opacity="1">margine 4,8%</text>
