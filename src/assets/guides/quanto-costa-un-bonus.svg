<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Calcolo del costo medio di un bonus casinò confrontato con l'importo del bonus</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F1A2C"/><stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FB6801" stop-opacity=".22"/><stop offset="1" stop-color="#FB6801" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#06BA55" stop-opacity=".18"/><stop offset="1" stop-color="#06BA55" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#EEF0F3" fill-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="170" r="520" fill="url(#glowO)"/>
<circle cx="260" cy="780" r="520" fill="url(#glowG)"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
<rect x="160" y="190" width="640" height="520" rx="28" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><text x="210" y="270" font-size="38" fill="#EEF0F3" text-anchor="start" font-weight="700" fill-opacity="1">Bonus casinò 100 €</text><line x1="210" y1="320" x2="750" y2="320" stroke="#2A3D59" stroke-width="2"/><text x="210" y="370" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Requisito</text><text x="750" y="370" font-size="34" fill="#EEF0F3" text-anchor="end" font-weight="700" fill-opacity="1">35 volte</text><line x1="210" y1="404" x2="750" y2="404" stroke="#2A3D59" stroke-width="2"/><text x="210" y="454" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Giocate richieste</text><text x="750" y="454" font-size="34" fill="#EEF0F3" text-anchor="end" font-weight="700" fill-opacity="1">3.500 €</text><line x1="210" y1="488" x2="750" y2="488" stroke="#2A3D59" stroke-width="2"/><text x="210" y="538" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Ritorno medio slot</text><text x="750" y="538" font-size="34" fill="#EEF0F3" text-anchor="end" font-weight="700" fill-opacity="1">96%</text><line x1="210" y1="572" x2="750" y2="572" stroke="#2A3D59" stroke-width="2"/><text x="210" y="622" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Costo medio</text><text x="750" y="622" font-size="34" fill="#E5484D" text-anchor="end" font-weight="700" fill-opacity="1">140 €</text><rect x="980" y="470" width="160" height="250" rx="14" fill="#06BA55"/><rect x="1220" y="370" width="160" height="350" rx="14" fill="#E5484D"/><text x="1060" y="450" font-size="36" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">100 €</text><text x="1300" y="350" font-size="36" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">140 €</text><text x="1060" y="770" font-size="28" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">bonus</text><text x="1300" y="770" font-size="28" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">costo medio</text>
</g>
</svg>
