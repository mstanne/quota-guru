<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Lista di regole personali e indicatore dello stato emotivo da calma a tilt</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F1A2C"/><stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FB6801" stop-opacity=".22"/><stop offset="1" stop-color="#FB6801" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#06BA55" stop-opacity=".18"/><stop offset="1" stop-color="#06BA55" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#EEF0F3" fill-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="170" r="520" fill="url(#glowO)"/>
<circle cx="260" cy="780" r="520" fill="url(#glowG)"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
<rect x="160" y="200" width="560" height="500" rx="28" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><text x="210" y="280" font-size="38" fill="#EEF0F3" text-anchor="start" font-weight="700" fill-opacity="1">Prima di giocare</text><path d="M210.4,348.0 L226.0,363.6 L256.0,331.2" fill="none" stroke="#06BA55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="360" font-size="32" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Budget del mese</text><path d="M210.4,430.0 L226.0,445.6 L256.0,413.2" fill="none" stroke="#06BA55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="442" font-size="32" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Limite di tempo</text><path d="M210.4,512.0 L226.0,527.6 L256.0,495.2" fill="none" stroke="#06BA55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="524" font-size="32" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Niente rincorse</text><path d="M210.4,594.0 L226.0,609.6 L256.0,577.2" fill="none" stroke="#06BA55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="606" font-size="32" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Pausa dopo 3 perdite</text><path d="M860.0,560.0 A260,260 0 0 1 1074.9,303.9" fill="none" stroke="#06BA55" stroke-width="48" stroke-linecap="butt" stroke-opacity="1.0"/><path d="M1083.8,302.5 A260,260 0 0 1 1250.0,334.8" fill="none" stroke="#FBBF24" stroke-width="48" stroke-linecap="butt" stroke-opacity="1.0"/><path d="M1257.8,339.5 A260,260 0 0 1 1380.0,560.0" fill="none" stroke="#E5484D" stroke-width="48" stroke-linecap="butt" stroke-opacity="1.0"/><line x1="1120" y1="560" x2="985.6" y2="425.6" stroke="#EEF0F3" stroke-width="14" stroke-linecap="round"/><circle cx="1120" cy="560" r="24" fill="#EEF0F3"/><text x="860" y="630" font-size="30" fill="#06BA55" text-anchor="middle" font-weight="600" fill-opacity="1">calma</text><text x="1380" y="630" font-size="30" fill="#E5484D" text-anchor="middle" font-weight="600" fill-opacity="1">tilt</text>
</g>
</svg>
