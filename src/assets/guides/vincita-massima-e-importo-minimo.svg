<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Importo minimo di una giocata e vincita massima per scommessa</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F1A2C"/><stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FB6801" stop-opacity=".22"/><stop offset="1" stop-color="#FB6801" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#06BA55" stop-opacity=".18"/><stop offset="1" stop-color="#06BA55" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#EEF0F3" fill-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="170" r="520" fill="url(#glowO)"/>
<circle cx="260" cy="780" r="520" fill="url(#glowG)"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
<rect x="170" y="240" width="470" height="420" rx="28" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><text x="405" y="330" font-size="34" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">Importo minimo</text><text x="405" y="470" font-size="120" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">1 €</text><rect x="275" y="540" width="260" height="64" rx="32.0" fill="#2A3D59"/><text x="405.0" y="582.8" font-size="30" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">unità 0,05 €</text><rect x="760" y="240" width="670" height="420" rx="28" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><text x="1095" y="330" font-size="34" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">Vincita massima</text><text x="1095" y="470" font-size="110" fill="#FB6801" text-anchor="middle" font-weight="700" fill-opacity="1">50.000 €</text><rect x="830" y="540" width="530" height="40" rx="20" fill="#0A1220"/><rect x="830" y="540" width="530" height="40" rx="20" fill="#FBBF24" fill-opacity=".85"/><rect x="1340" y="520" width="14" height="80" rx="7" fill="#EEF0F3"/><text x="1095" y="630" font-size="28" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">tetto per scommessa</text>
</g>
</svg>
