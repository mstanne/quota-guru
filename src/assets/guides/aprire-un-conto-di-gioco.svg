="290" width="490" height="30" fill="#06BA55"/><circle cx="1070" cy="420" r="58" fill="#BECED8"/><circle cx="1070" cy="404" r="24" fill="#EEF0F3"/><path d="M1030,460 a40,34 0 0 1 80,0" fill="#EEF0F3"/><rect x="1160" y="376" width="210" height="16" rx="8" fill="#7F93AE"/><rect x="1160" y="412" width="170" height="16" rx="8" fill="#7F93AE"/><rect x="1160" y="448" width="230" height="16" rx="8" fill="#7F93AE"/><rect x="1290" y="590" width="160" height="64" rx="32.0" fill="#16243B"/><text x="1370.0" y="633.52" font-size="32" fill="#EEF0F3" text-anchor="middle" font-weight="700" fill-opacity="1">18+</text><text x="960" y="630" font-size="30" fill="#7F93AE" text-anchor="start" font-weight="600" fill-opacity="1">verifica</text><text x="960" y="670" font-size="30" fill="#7F93AE" text-anchor="start" font-weight="600" fill-opacity="1">dell'identità</text>
