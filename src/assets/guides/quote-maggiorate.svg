<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Quota maggiorata da 1,80 a 2,00 e somma delle probabilità implicite che scende al 100%</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F1A2C"/><stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FB6801" stop-opacity=".22"/><stop offset="1" stop-color="#FB6801" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#06BA55" stop-opacity=".18"/><stop offset="1" stop-color="#06BA55" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#EEF0F3" fill-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="170" r="520" fill="url(#glowO)"/>
<circle cx="260" cy="780" r="520" fill="url(#glowG)"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
<rect x="160" y="220" width="560" height="460" rx="28" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><text x="440" y="300" font-size="36" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">Quota</text><text x="440" y="430" font-size="110" fill="#BECED8" text-anchor="middle" font-weight="700" fill-opacity="1">1,80</text><line x1="300" y1="400" x2="580" y2="400" stroke="#E5484D" stroke-width="12" stroke-linecap="round"/><rect x="260" y="520" width="360" height="80" rx="40.0" fill="#FB6801"/><text x="440.0" y="580.16" font-size="56" fill="#0A1220" text-anchor="middle" font-weight="700" fill-opacity="1">2,00</text><text x="440" y="650" font-size="28" fill="#7F93AE" text-anchor="middle" font-weight="600" fill-opacity="1">maggiorata · max 10 €</text><text x="830" y="280" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Somma prob. normali</text><rect x="830" y="300" width="560" height="70" rx="16" fill="#16243B"/><rect x="830" y="300" width="538" height="70" rx="16" fill="#BECED8"/><text x="856" y="350" font-size="34" fill="#0A1220" text-anchor="start" font-weight="700" fill-opacity="1">105,6%</text><text x="830" y="470" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Con la maggiorazione</text><rect x="830" y="490" width="560" height="70" rx="16" fill="#16243B"/><rect x="830" y="490" width="509" height="70" rx="16" fill="#06BA55"/><text x="856" y="540" font-size="34" fill="#0A1220" text-anchor="start" font-weight="700" fill-opacity="1">100,0%</text><line x1="1339" y1="270" x2="1339" y2="600" stroke="#EEF0F3" stroke-width="4" stroke-dasharray="10 8"/>
</g>
</svg>
