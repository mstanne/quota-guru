<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
<title>Condizioni di un bonus con barra del requisito di giocata e lente di ingrandimento</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F1A2C"/><stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FB6801" stop-opacity=".22"/><stop offset="1" stop-color="#FB6801" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#06BA55" stop-opacity=".18"/><stop offset="1" stop-color="#06BA55" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#EEF0F3" fill-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="170" r="520" fill="url(#glowO)"/>
<circle cx="260" cy="780" r="520" fill="url(#glowG)"/>
<g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
<rect x="160" y="170" width="860" height="560" rx="28" fill="#16243B" stroke="#2A3D59" stroke-width="2"/><text x="210" y="250" font-size="40" fill="#EEF0F3" text-anchor="start" font-weight="700" fill-opacity="1">Condizioni dell'offerta</text><text x="210" y="330" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Requisito di giocata 5x</text><text x="970" y="330" font-size="30" fill="#EEF0F3" text-anchor="end" font-weight="700" fill-opacity="1">40 € / 50 €</text><rect x="210" y="355" width="760" height="40" rx="20" fill="#0A1220"/><rect x="210" y="355" width="608" height="40" rx="20" fill="#FBBF24"/><line x1="210" y1="420" x2="970" y2="420" stroke="#2A3D59" stroke-width="2"/><text x="210" y="468" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Quota minima</text><text x="970" y="468" font-size="32" fill="#EEF0F3" text-anchor="end" font-weight="700" fill-opacity="1">1,50</text><line x1="210" y1="502" x2="970" y2="502" stroke="#2A3D59" stroke-width="2"/><text x="210" y="550" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Scadenza</text><text x="970" y="550" font-size="32" fill="#EEF0F3" text-anchor="end" font-weight="700" fill-opacity="1">30 giorni</text><line x1="210" y1="584" x2="970" y2="584" stroke="#2A3D59" stroke-width="2"/><text x="210" y="632" font-size="30" fill="#BECED8" text-anchor="start" font-weight="600" fill-opacity="1">Deposito minimo</text><text x="970" y="632" font-size="32" fill="#EEF0F3" text-anchor="end" font-weight="700" fill-opacity="1">10 €</text><circle cx="1230" cy="410" r="150" fill="#06BA55" fill-opacity=".08" stroke="#EEF0F3" stroke-width="22"/><line x1="1340" y1="520" x2="1450" y2="630" stroke="#EEF0F3" stroke-width="40" stroke-linecap="round"/><rect x="1150" y="360" width="160" height="16" rx="8" fill="#EEF0F3" fill-opacity=".5"/><rect x="1150" y="400" width="120" height="16" rx="8" fill="#EEF0F3" fill-opacity=".5"/><rect x="1150" y="440" width="180" height="16" rx="8" fill="#EEF0F3" fill-opacity=".5"/>
</g>
</svg>
